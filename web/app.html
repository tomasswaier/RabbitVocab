<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RabbitVocab</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
	<header class="border-b border-slate-700 px-6 py-4 flex items-center justify-between">
	  <h1 class="text-xl font-semibold">RabbitVocab</h1>
	  <div class="flex items-center gap-4">
	    <select id="language-select" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm"></select>
	    <button id="logout-btn" class="text-sm text-slate-400 hover:text-slate-100 transition">Log out</button>
	  </div>
	</header>
  <nav class="flex gap-2 px-6 pt-4 flex-wrap">
    <button class="tab-btn" data-tab="languages">Languages</button>
    <button class="tab-btn" data-tab="words">Words</button>
    <button class="tab-btn" data-tab="verbforms">Verb Forms</button>
    <button class="tab-btn" data-tab="testwords">Test Words</button>
    <button class="tab-btn" data-tab="testverbs">Test Verbs</button>
  </nav>

  <main class="p-6 max-w-2xl">
    <section id="tab-languages" class="tab-panel space-y-6"></section>
    <section id="tab-words" class="tab-panel space-y-6 hidden"></section>
    <section id="tab-verbforms" class="tab-panel space-y-6 hidden"></section>
    <section id="tab-testwords" class="tab-panel space-y-6 hidden"></section>
    <section id="tab-testverbs" class="tab-panel space-y-6 hidden"></section>
  </main>

  <style>
    .tab-btn {
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      background: rgb(30 41 59);
      color: rgb(148 163 184);
      font-size: 0.875rem;
      transition: all 0.15s;
    }
    .tab-btn:hover { color: rgb(241 245 249); }
    .tab-btn.active { background: rgb(79 70 229); color: white; }
  </style>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
